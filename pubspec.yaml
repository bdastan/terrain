name: prime_work
description: Application tout-en-un pour distributeurs Herbalife
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0

  # Navigation
  go_router: ^12.1.3

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9

  # Authentication
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^5.0.0

  # Local Storage
  shared_preferences: ^2.2.2

  # API & Network
  http: ^1.1.2
  dio: ^5.4.0

  # Calendar
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^24.1.41

  # Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0

  # Charts
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  timeago: ^3.6.0

  # Payment
  flutter_stripe: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/

  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
